<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passeggiata del Gelsomino — Wi-Fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --pine:#0E3A66;
    --pine-2:#154C82;
    --stone:#FFFFFF;
    --stone-2:#E5F0FA;
    --brass:#2E86C1;
    --brass-light:#8FCBEF;
    --ink:#122436;
    --ink-soft:#5A7288;
    --line:rgba(14,58,102,0.12);
    --shadow: 0 10px 30px -14px rgba(14,58,102,0.30);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--stone); font-family:'Comfortaa', sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; min-height:100svh;
  }
  .app{
    max-width:520px; margin:0 auto; min-height:100svh; background:var(--stone); position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,0.08);
  }
  @media (min-width:560px){
    body{ background: linear-gradient(180deg,#DCE8F5, #C7DCF0 60%, #b7d0ea); padding:28px 0; }
    .app{ border-radius:34px; overflow:hidden; min-height:calc(100svh - 56px); box-shadow: 0 30px 80px -20px rgba(14,58,102,0.35); }
  }

  header.top{
    background:var(--pine); color:#fff; padding:18px 20px 20px; position:relative;
  }
  header.top::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(143,203,239,0.30), transparent 55%),
      radial-gradient(90% 90% at 0% 100%, rgba(14,58,102,0.35), transparent 55%);
    pointer-events:none;
  }
  .back-row{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back-link{
    display:flex; align-items:center; gap:6px; color:#fff; text-decoration:none;
    font-weight:600; font-size:13px; opacity:0.9;
  }
  .back-link svg{ width:16px; height:16px; }
  h1.page-title{
    position:relative; z-index:1; margin:14px 0 2px; font-size:22px; font-weight:500; color:#fff; line-height:1.15;
  }
  .page-sub{ position:relative; z-index:1; margin:0; font-size:12.5px; color:var(--brass-light); font-weight:600; letter-spacing:0.02em; }

  .lang-select{ position:relative; z-index:20; flex-shrink:0; }
  .lang-current{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22);
    border-radius:999px; padding:8px 12px; color:#fff; font-family:'Comfortaa'; font-weight:700; font-size:12px; cursor:pointer;
  }
  .lang-current svg{ width:13px; height:13px; transition:transform .2s; }
  .lang-current.open svg{ transform:rotate(180deg); }
  .lang-menu{
    position:fixed; background:#fff; border-radius:14px;
    box-shadow:0 14px 34px -10px rgba(14,58,102,0.4); border:1px solid var(--line);
    padding:6px; display:none; min-width:160px; max-height:70vh; overflow-y:auto;
    z-index:999;
  }
  .lang-menu.open{ display:block; }
  .lang-menu button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    padding:9px 10px; border-radius:9px; font-family:'Comfortaa'; font-weight:600; font-size:13px;
    color:var(--ink); cursor:pointer;
  }
  .lang-menu button:hover{ background:var(--stone-2); }
  .lang-menu button.active{ background:var(--stone-2); color:var(--pine); }
  .lang-menu button .code{ margin-left:auto; font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  main{ flex:1; padding:22px 16px 28px; display:flex; flex-direction:column; align-items:center; }

  .wifi-banner{
    width:100%; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line);
    background: radial-gradient(120% 160% at 30% 20%, #29C5D6, #0F94A8 75%);
    padding:34px 20px; text-align:center; margin-bottom:22px; position:relative;
  }
  .wifi-banner svg{ width:64px; height:64px; color:#fff; }
  .wifi-banner .wb-label{ color:#fff; font-weight:700; font-size:15px; letter-spacing:0.06em; margin-top:10px; }

  .qr-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px; display:flex; flex-direction:column; align-items:center; width:100%; margin-bottom:20px;
  }
  .qr-card img{ width:100%; max-width:260px; height:auto; border-radius:10px; }
  .qr-hint{ margin:14px 0 0; font-size:13px; color:var(--ink-soft); text-align:center; line-height:1.5; }

  .creds{ width:100%; background:var(--stone-2); border-radius:14px; padding:16px 18px; margin-bottom:6px; }
  .creds .row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(14,58,102,0.10); }
  .creds .row:last-child{ border-bottom:none; }
  .creds .label{ font-size:11.5px; font-weight:700; color:var(--pine); text-transform:uppercase; letter-spacing:0.05em; }
  .creds .value{ font-size:15px; font-weight:700; color:var(--ink); font-family:'Comfortaa'; }

  footer.contact-bar{
    background:var(--stone-2); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .contact-bar .brandline{ font-size:13px; font-weight:700; color:var(--pine); }
  .contact-bar .brandline small{ display:block; font-weight:500; color:var(--ink-soft); font-size:11px; }
  .contact-bar a.phone{
    display:flex; align-items:center; gap:8px; background:var(--pine); color:#fff; text-decoration:none;
    padding:9px 14px; border-radius:999px; font-weight:700; font-size:12.5px;
  }
  .contact-bar a.phone svg{ width:14px; height:14px; }
</style>
</head>

<script>
const LANG_LABELS = { it:'IT', en:'EN', fr:'FR', de:'DE', es:'ES', hu:'HU', ro:'RO', pl:'PL' };

const I18N = {
  it: { back:"Guida", title:"Wi-Fi", sub:"Connessione alla rete dell'appartamento", banner:"WI-FI", hint:"Inquadra il codice con la fotocamera del telefono per connetterti automaticamente.", network:"Rete", password:"Password" },
  en: { back:"Guide", title:"Wi-Fi", sub:"Connect to the apartment's network", banner:"WI-FI", hint:"Point your phone's camera at the code to connect automatically.", network:"Network", password:"Password" },
  fr: { back:"Guide", title:"Wi-Fi", sub:"Connexion au réseau de l'appartement", banner:"WI-FI", hint:"Pointez la caméra de votre téléphone vers le code pour vous connecter automatiquement.", network:"Réseau", password:"Mot de passe" },
  de: { back:"Guide", title:"Wi-Fi", sub:"Verbindung zum Netzwerk der Wohnung", banner:"WI-FI", hint:"Richte die Handykamera auf den Code, um dich automatisch zu verbinden.", network:"Netzwerk", password:"Passwort" },
  es: { back:"Guía", title:"Wi-Fi", sub:"Conexión a la red del apartamento", banner:"WI-FI", hint:"Apunta la cámara del móvil al código para conectarte automáticamente.", network:"Red", password:"Contraseña" },
  hu: { back:"Kalauz", title:"Wi-Fi", sub:"Csatlakozás a lakás hálózatához", banner:"WI-FI", hint:"Irányítsd a telefonod kameráját a kódra az automatikus csatlakozáshoz.", network:"Hálózat", password:"Jelszó" },
  ro: { back:"Ghid", title:"Wi-Fi", sub:"Conectare la rețeaua apartamentului", banner:"WI-FI", hint:"Îndreaptă camera telefonului spre cod pentru a te conecta automat.", network:"Rețea", password:"Parolă" },
  pl: { back:"Przewodnik", title:"Wi-Fi", sub:"Połączenie z siecią mieszkania", banner:"WI-FI", hint:"Skieruj aparat telefonu na kod, aby połączyć się automatycznie.", network:"Sieć", password:"Hasło" }
};

const menu = document.getElementById('langMenu');
const btn = document.getElementById('langCurrentBtn');

function toggleLangMenu(){
  const isOpen = menu.classList.contains('open');
  if(!isOpen){
    const rect = btn.getBoundingClientRect();
    const appEl = document.querySelector('.app');
    const bounds = appEl.getBoundingClientRect();
    const menuWidth = 176;
    menu.style.display = 'block';
    let left = rect.right - menuWidth;
    left = Math.max(bounds.left + 8, Math.min(left, bounds.right - menuWidth - 8));
    menu.style.left = left + 'px';
    menu.style.right = 'auto';
    menu.style.width = menuWidth + 'px';
    let top = rect.bottom + 8;
    const menuMaxHeight = Math.min(320, window.innerHeight * 0.6);
    if(top + menuMaxHeight > Math.min(bounds.bottom, window.innerHeight)){
      top = Math.max(bounds.top + 8, rect.top - menuMaxHeight - 8);
    }
    menu.style.top = top + 'px';
    menu.style.display = '';
  }
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}

document.addEventListener('click', function(e){
  const sel = document.getElementById('langSelect');
  if(sel && !sel.contains(e.target)){
    menu.classList.remove('open');
    btn.classList.remove('open');
  }
});
window.addEventListener('resize', function(){
  menu.classList.remove('open');
  btn.classList.remove('open');
});

function setLang(lang){
  if(!I18N[lang]) lang = 'it';
  const d = I18N[lang];
  localStorage.setItem('vbLang', lang);
  document.getElementById('langCurrentLabel').textContent = LANG_LABELS[lang];
  document.querySelectorAll('.lang-menu button').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  menu.classList.remove('open');
  btn.classList.remove('open');

  document.getElementById('backLabel').textContent = d.back;
  document.getElementById('backLabelBottom').textContent = d.back;
  document.getElementById('pageTitle').textContent = d.title;
  document.getElementById('pageSub').textContent = d.sub;
  document.getElementById('bannerLabel').textContent = d.banner;
  document.getElementById('qrHint').textContent = d.hint;
  document.getElementById('labelNetwork').textContent = d.network;
  document.getElementById('labelPassword').textContent = d.password;

  document.documentElement.lang = lang;
}

setLang(localStorage.getItem('vbLang') || 'it');
</script>
